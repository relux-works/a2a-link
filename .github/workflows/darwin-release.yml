# Private reusable native producer. No tag trigger and no publication authority.
# The future shared tag controller calls this job as darwin-producer; Fulcio
# binds its checksum certificate to this reusable workflow, retaining the
# reviewed Darwin identity. The combined publication command remains held.
name: Darwin release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      tag-object:
        required: true
        type: string
      commit:
        required: true
        type: string
    secrets:
      MACOS_SIGN_P12:
        required: false
      MACOS_SIGN_P12_PASSWORD:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_KEY_P8:
        required: false
    outputs:
      artifact-id:
        value: ${{ jobs.prepare.outputs.artifact-id }}
      artifact-digest:
        value: ${{ jobs.prepare.outputs.artifact-digest }}
permissions: {}
env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly -p=1
  GOWORK: 'off'
  GOENV: 'off'
jobs:
  admission:
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - name: Admit exact signed tag, reviewed current main and required checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ADMITTED_TAG_OBJECT: ${{ inputs.tag-object }}
        shell: bash
        run: |
          set -euo pipefail
          go run -p 1 ./cmd/a2a-release admit "$RELEASE_TAG" > "$RUNNER_TEMP/admission.json"
  prepare:
    needs: admission
    permissions:
      contents: read
      id-token: write
      checks: read
      actions: read
      pull-requests: read
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      artifact-digest: ${{ steps.bundle.outputs.artifact-digest }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: 'v2.6.1'
      - name: Compile nonsecret private producer
        run: go build -p 1 -o "$RUNNER_TEMP/a2a-release-gate" ./cmd/a2a-release
      - name: Existing native build, explicit signing, notarization and private readback
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ADMITTED_TAG_OBJECT: ${{ inputs.tag-object }}
          GITHUB_TOKEN: ${{ github.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          .scripts/release-config.sh
          "$RUNNER_TEMP/a2a-release-gate" prepare "$RELEASE_TAG" > "$RUNNER_TEMP/private-preparation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: bundle
        with:
          name: a2a-darwin-${{ inputs.tag-object }}
          path: |
            ${{ runner.temp }}/a2a-release-output/a2a_*_darwin_arm64.tar.gz
            ${{ runner.temp }}/a2a-release-output/checksums.txt
            ${{ runner.temp }}/a2a-release-output/checksums.txt.sig
            ${{ runner.temp }}/a2a-release-output/checksums.txt.pem
            ${{ runner.temp }}/a2a-release-output/evidence.tar.gz
            ${{ runner.temp }}/a2a-release-output/release-evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove this job's ephemeral signing material on every exit
        if: always()
        run: .scripts/release-cleanup.sh
